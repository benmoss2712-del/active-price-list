function b64ToBlob(b64, type) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type });
}
document.getElementById('dl').onclick = () => {
  try {
    const blob = b64ToBlob(b64, 'application/pdf');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hr9637-quiz-a4-notes.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    document.getElementById('status').textContent = 'Download started — check your Downloads folder for hr9637-quiz-a4-notes.pdf';

    document.getElementById('status').textContent = 'Download blocked — use Print instead, or long-press/save the page images.';

};
